<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FALSE NOTE – The Silent Witness. Visual Novel Edukasi Anti-Korupsi.">
  <title>FALSE NOTE – The Silent Witness</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">

  <!-- Phaser 3.80 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
  <!-- Main Menu Overlay -->
  <div id="main-menu" class="hidden fixed inset-0 z-40 w-full h-screen bg-[url('assets/backgrounds/bg_main_menu.jpg')] bg-cover bg-center">
    <div class="absolute left-0 top-0 w-full md:w-1/3 h-full bg-white/10 backdrop-blur-md flex flex-col justify-center px-12 space-y-6 border-r border-white/20">
      
      <h1 class="text-amber-500 text-5xl font-bold tracking-tighter mb-8 drop-shadow-2xl">
        FALSE <span class="text-white">NOTE</span>
      </h1>

      <button id="btn-start" class="group relative px-8 py-4 bg-slate-900/80 rounded-2xl border-l-4 border-amber-500 text-left transition-all duration-300 hover:scale-105 hover:bg-amber-500/20 hover:shadow-[0_0_20px_rgba(251,191,36,0.3)]">
        <span class="text-white font-semibold tracking-widest uppercase group-hover:text-amber-400">Mulai Baru</span>
        <div class="text-slate-400 text-xs mt-1 group-hover:text-slate-200">Menjadi saksi bisu di FH UI</div>
      </button>

      <button id="btn-continue" class="group relative px-8 py-4 bg-slate-900/80 rounded-2xl border-l-4 border-amber-500 text-left transition-all duration-300 hover:scale-105 hover:bg-amber-500/20 hover:shadow-[0_0_20px_rgba(251,191,36,0.3)]">
        <span class="text-white font-semibold tracking-widest uppercase group-hover:text-amber-400">Lanjutkan Perjuangan?</span>
        <div class="text-slate-400 text-xs mt-1 group-hover:text-slate-200">Muat progres terakhir</div>
      </button>

      <button id="btn-gallery" class="group relative px-8 py-4 bg-slate-900/80 rounded-2xl border-l-4 border-amber-500 text-left transition-all duration-300 hover:scale-105 hover:bg-amber-500/20 hover:shadow-[0_0_20px_rgba(251,191,36,0.3)]">
        <span class="text-white font-semibold tracking-widest uppercase group-hover:text-amber-400">Lihat Bukti</span>
        <div class="text-slate-400 text-xs mt-1 group-hover:text-slate-200">Galeri bukti investigasi</div>
      </button>

      <button id="btn-options" class="group relative px-8 py-4 bg-slate-900/80 rounded-2xl border-l-4 border-slate-700 text-left transition-all duration-300 hover:scale-105 hover:border-white/50 hover:bg-slate-800/50">
        <span class="text-slate-300 font-semibold tracking-widest uppercase group-hover:text-white">Opsi & Pengaturan</span>
      </button>

      <div id="save-error" class="hidden text-red-500 text-sm font-medium italic animate-pulse">Save tidak ditemukan.</div>
    </div>
  </div>

  <!-- HUD Overlay (Nyali & Ancaman) -->
  <div id="hud-overlay" class="hidden fixed top-0 left-0 w-full z-30 p-6 flex justify-between items-start pointer-events-none">
    
    <!-- Stats Container (Kiri) -->
    <div class="flex flex-col space-y-4">
      <!-- Nyali Bar -->
      <div class="flex items-center">
        <div class="w-8 h-8 rounded-full bg-white/10 backdrop-blur-sm border border-amber-500/50 flex items-center justify-center mr-2 z-10 shadow-[0_0_15px_rgba(245,158,11,0.5)]">
          <span class="text-amber-400 text-xs font-bold">NY</span>
        </div>
        <div class="relative w-48 h-4 bg-slate-800/80 rounded-full overflow-hidden -ml-4 pl-4 border border-white/10">
          <div id="nyali-bar" class="h-full rounded-r-full bg-gradient-to-r from-orange-400 to-red-600 shadow-[0_0_10px_rgba(220,38,38,0.8)] transition-all duration-500 ease-out" style="width: 100%;"></div>
        </div>
      </div>

      <!-- Ancaman Bar -->
      <div class="flex items-center">
        <div class="w-8 h-8 rounded-full bg-white/10 backdrop-blur-sm border border-slate-500/50 flex items-center justify-center mr-2 z-10">
          <span class="text-slate-300 text-xs font-bold">AN</span>
        </div>
        <div class="relative w-48 h-4 bg-slate-800/80 rounded-full overflow-hidden -ml-4 pl-4 border border-white/10">
          <div id="ancaman-bar" class="h-full rounded-r-full bg-gradient-to-r from-slate-700 to-black transition-all duration-500 ease-out" style="width: 0%;"></div>
        </div>
      </div>
    </div>

    <!-- Inventory Container (Kanan) -->
    <div class="flex flex-col items-end">
      <div class="text-amber-400 text-xs font-bold tracking-widest mb-2 shadow-amber-500/20 drop-shadow-md">BUKTI INVESTIGASI</div>
      <div class="flex space-x-3">
        <!-- Slot 1 -->
        <div id="inv-slot-0" class="w-14 h-14 rounded-xl bg-slate-900/80 border border-slate-700 flex items-center justify-center text-[10px] text-center text-slate-500 p-1 transition-all duration-300">Kosong</div>
        <!-- Slot 2 -->
        <div id="inv-slot-1" class="w-14 h-14 rounded-xl bg-slate-900/80 border border-slate-700 flex items-center justify-center text-[10px] text-center text-slate-500 p-1 transition-all duration-300">Kosong</div>
        <!-- Slot 3 -->
        <div id="inv-slot-2" class="w-14 h-14 rounded-xl bg-slate-900/80 border border-slate-700 flex items-center justify-center text-[10px] text-center text-slate-500 p-1 transition-all duration-300">Kosong</div>
      </div>
    </div>
  </div>

  <!-- Dialog Box Overlay -->
  <div id="dialog-overlay" class="hidden fixed bottom-0 left-0 w-full z-40 pb-6 pointer-events-none">
    <div class="max-w-4xl mx-auto relative cursor-pointer pointer-events-auto" id="dialog-box">
      
      <!-- Character Name Bubble -->
      <div id="dialog-name" class="absolute -top-6 left-8 bg-amber-500 text-black font-bold px-6 py-2 rounded-t-xl rounded-br-xl shadow-lg shadow-amber-500/20 tracking-wider">
        RAKA
      </div>

      <!-- Main Text Box -->
      <div class="bg-gradient-to-b from-slate-900/90 to-black/95 border border-white/10 rounded-3xl p-8 shadow-2xl min-h-[160px] flex flex-col justify-between">
        <p id="dialog-text" class="text-white text-lg font-serif leading-relaxed"></p>
        <div id="dialog-continue" class="text-amber-500/70 text-right text-sm italic mt-4 animate-pulse hidden">Klik untuk lanjut...</div>
      </div>

    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container" class="relative"></div>

  <!-- Tooltip Overlay (DOM-based, di atas canvas) -->
  <div id="evidence-tooltip" class="hidden absolute z-50 bg-gray-900/95 text-white text-sm p-3 rounded-lg border border-amber-500/30 max-w-xs pointer-events-none shadow-xl">
    <strong id="tooltip-name" class="text-amber-400 block mb-1"></strong>
    <p id="tooltip-desc" class="text-gray-300 mb-1"></p>
    <small id="tooltip-hint" class="text-gray-500 italic"></small>
  </div>

  <!-- Main Game Entry -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
