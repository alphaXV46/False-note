<!DOCTYPE html>
<html lang="id">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FALSE NOTE – The Silent Witness</title>

  <!-- Tailwind CSS CDN -->

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">

  <!-- Phaser 3.80 -->

<body class="bg-black m-0 p-0 overflow-hidden flex items-center justify-center min-h-screen">
