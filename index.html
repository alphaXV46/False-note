<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="FALSE NOTE – The Silent Witness. Visual Novel Edukasi Anti-Korupsi.">
  <title>FALSE NOTE – The Silent Witness</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Custom CSS -->
  <link rel="stylesheet" href="css/custom.css">

  <!-- Phaser 3.80 -->
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
</head>
<body class="bg-black m-0 p-0 overflow-hidden flex items-center justify-center min-h-screen">

  <!-- Main Menu Overlay (DOM-based) -->
  <div id="main-menu" class="hidden fixed inset-0 z-40 w-full h-screen bg-[url('assets/backgrounds/bg_main_menu.jpg')] bg-cover bg-center">
    <div class="absolute left-0 top-0 w-full md:w-1/3 h-full bg-white/10 backdrop-blur-md flex flex-col justify-center px-12 space-y-6 border-r border-white/20">
      
      <h1 class="text-amber-500 text-5xl font-bold tracking-tighter mb-8 drop-shadow-2xl">
        FALSE <span class="text-white">NOTE</span>
      </h1>

      <button id="btn-start" class="group relative px-6 py-4 bg-slate-900/80 border-2 border-amber-600/50 rounded-lg text-left transition-all duration-300 hover:border-amber-400 hover:shadow-[0_0_20px_rgba(251,191,36,0.3)]">
        <span class="text-white font-semibold tracking-widest uppercase group-hover:text-amber-400">Mulai Baru</span>
        <div class="text-slate-400 text-xs mt-1 group-hover:text-slate-200">Menjadi saksi bisu di FH UI</div>
      </button>

      <button id="btn-continue" class="group relative px-6 py-4 bg-slate-900/80 border-2 border-amber-600/50 rounded-lg text-left transition-all duration-300 hover:border-amber-400 hover:shadow-[0_0_20px_rgba(251,191,36,0.3)]">
        <span class="text-white font-semibold tracking-widest uppercase group-hover:text-amber-400">Lanjutkan Perjuangan?</span>
        <div class="text-slate-400 text-xs mt-1 group-hover:text-slate-200">Muat progres terakhir</div>
      </button>

      <button id="btn-gallery" class="group relative px-6 py-4 bg-slate-900/80 border-2 border-amber-600/50 rounded-lg text-left transition-all duration-300 hover:border-amber-400 hover:shadow-[0_0_20px_rgba(251,191,36,0.3)]">
        <span class="text-white font-semibold tracking-widest uppercase group-hover:text-amber-400">Lihat Bukti</span>
        <div class="text-slate-400 text-xs mt-1 group-hover:text-slate-200">Galeri bukti investigasi</div>
      </button>

      <button id="btn-options" class="group relative px-6 py-4 bg-slate-900/80 border-2 border-slate-700 rounded-lg text-left transition-all duration-300 hover:border-white/50">
        <span class="text-slate-300 font-semibold tracking-widest uppercase group-hover:text-white">Opsi & Pengaturan</span>
      </button>

      <div id="save-error" class="hidden text-red-500 text-sm font-medium italic animate-pulse">Save tidak ditemukan.</div>

    </div>
  </div>

  <!-- Game Container -->
  <div id="game-container" class="relative"></div>

  <!-- Tooltip Overlay (DOM-based, di atas canvas) -->
  <div id="evidence-tooltip" class="hidden absolute z-50 bg-gray-900/95 text-white text-sm p-3 rounded-lg border border-amber-500/30 max-w-xs pointer-events-none shadow-xl">
    <strong id="tooltip-name" class="text-amber-400 block mb-1"></strong>
    <p id="tooltip-desc" class="text-gray-300 mb-1"></p>
    <small id="tooltip-hint" class="text-gray-500 italic"></small>
  </div>

  <!-- Main Game Entry -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
